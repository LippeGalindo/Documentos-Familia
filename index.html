<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestor de Documentos</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#2563eb">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800 pb-20">

  <!-- Cabeçalho -->
  <header class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10 flex justify-between items-center">
    <h1 class="text-xl font-bold flex items-center gap-2">
      <i class="fa-solid fa-folder-closed"></i> Meus Documentos
    </h1>
    <button onclick="openTypeModal()" class="bg-blue-700 hover:bg-blue-800 text-xs px-3 py-2 rounded-lg font-medium border border-blue-400">
      <i class="fa-solid fa-tags"></i> Tipos
    </button>
  </header>

  <!-- Navegação de Navegação (Breadcrumb) -->
  <div class="p-4 bg-white border-b flex items-center gap-2 text-sm overflow-x-auto" id="breadcrumb">
    <!-- Gerado dinamicamente via JS -->
  </div>

  <!-- Conteúdo Principal -->
  <main class="p-4 max-w-3xl mx-auto">
    <!-- Botões de Ação Rápida -->
    <div class="grid grid-cols-2 gap-3 mb-6">
      <button onclick="openFolderModal()" class="bg-white border-2 border-dashed border-gray-300 p-3 rounded-xl flex items-center justify-center gap-2 font-medium text-gray-600 hover:border-blue-500 hover:text-blue-600">
        <i class="fa-solid fa-folder-plus text-blue-500"></i> Nova Pasta
      </button>
      <button onclick="openUploadModal()" class="bg-blue-600 text-white p-3 rounded-xl flex items-center justify-center gap-2 font-medium shadow-sm hover:bg-blue-700">
        <i class="fa-solid fa-camera"></i> Subir Documento
      </button>
    </div>

    <!-- Lista de Pastas -->
    <section class="mb-6">
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Pastas</h2>
      <div id="folders-list" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <!-- Pastas renderizadas via JS -->
      </div>
    </section>

    <!-- Lista de Documentos -->
    <section>
      <h2 class="text-xs font-semibold uppercase tracking-wider text-gray-400 mb-2">Arquivos nesta pasta</h2>
      <div id="documents-list" class="space-y-2">
        <!-- Documentos renderizados via JS -->
      </div>
    </section>
  </main>

  <!-- MODAL: Criar Nova Pasta -->
  <div id="folder-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-3">Nova Pasta</h3>
      <input type="text" id="folder-name-input" placeholder="Nome da pasta (ex: Receituários)" class="w-full border p-2 rounded-lg mb-4 outline-none focus:border-blue-500">
      <div class="flex justify-end gap-2">
        <button onclick="closeModals()" class="px-4 py-2 text-gray-500">Cancelar</button>
        <button onclick="createFolder()" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Criar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Upload / Foto de Documento -->
  <div id="upload-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-3">Adicionar Documento</h3>
      
      <label class="block text-sm font-medium mb-1">Título do Documento</label>
      <input type="text" id="doc-title-input" placeholder="Ex: Exame de Sangue" class="w-full border p-2 rounded-lg mb-3 outline-none focus:border-blue-500">

      <label class="block text-sm font-medium mb-1">Tipo de Documento</label>
      <select id="doc-type-select" class="w-full border p-2 rounded-lg mb-3 outline-none focus:border-blue-500">
        <!-- Tipos carregados via JS -->
      </select>

      <label class="block text-sm font-medium mb-1">Arquivo / Foto</label>
      <input type="file" id="doc-file-input" accept="image/*,application/pdf" capture="environment" class="w-full border p-2 rounded-lg mb-4">

      <div class="flex justify-end gap-2">
        <button onclick="closeModals()" class="px-4 py-2 text-gray-500">Cancelar</button>
        <button onclick="uploadDocument()" id="btn-upload" class="px-4 py-2 bg-blue-600 text-white rounded-lg">Salvar</button>
      </div>
    </div>
  </div>

  <!-- MODAL: Gerenciar Tipos de Documentos -->
  <div id="type-modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-xl p-5 w-full max-w-sm">
      <h3 class="text-lg font-bold mb-3">Tipos de Documento</h3>
      <div class="flex gap-2 mb-4">
        <input type="text" id="type-name-input" placeholder="Novo Tipo (ex: Laudo)" class="flex-1 border p-2 rounded-lg outline-none focus:border-blue-500">
        <button onclick="createDocumentType()" class="px-3 py-2 bg-green-600 text-white rounded-lg"><i class="fa-solid fa-plus"></i></button>
      </div>
      <div id="types-list" class="max-h-40 overflow-y-auto space-y-1 mb-4 text-sm border-t pt-2">
        <!-- Lista de tipos via JS -->
      </div>
      <div class="flex justify-end">
        <button onclick="closeModals()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg">Fechar</button>
      </div>
    </div>
  </div>

  <script>
    // Configurações do Supabase (Substitua pelas suas credenciais)
    const SUPABASE_URL = 'https://ymwfvaexmxmdrsiafzjv.supabase.co/rest/v1/';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inltd2Z2YWV4bXhtZHJzaWFmemp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyNjkyNjgsImV4cCI6MjEwMDg0NTI2OH0.th6eKMkgWsTPhVjrHCsvdO36ueTCKbDlEFvke0clHCE';
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentFolderId = null;
    let folderHistory = [];

    // Inicialização
    window.onload = () => {
      loadFolders();
      loadDocuments();
      loadBreadcrumb();
      loadDocumentTypes();
    };

    // Navegação e Carregamento de Pastas
    async function loadFolders() {
      let query = supabase.from('folders').select('*');
      if (currentFolderId) {
        query = query.eq('parent_id', currentFolderId);
      } else {
        query = query.is('parent_id', null);
      }

      const { data, error } = await query;
      const container = document.getElementById('folders-list');
      container.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(folder => {
          container.innerHTML += `
            <div onclick="navigateToFolder('${folder.id}', '${folder.name}')" class="bg-white p-4 rounded-xl border flex items-center justify-between shadow-sm cursor-pointer hover:border-blue-400">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-folder text-amber-500 text-2xl"></i>
                <span class="font-medium">${folder.name}</span>
              </div>
              <i class="fa-solid fa-chevron-right text-gray-400 text-xs"></i>
            </div>
          `;
        });
      } else {
        container.innerHTML = `<p class="text-sm text-gray-400 col-span-2">Nenhuma pasta cadastrada aqui.</p>`;
      }
    }

    // Carregamento de Documentos
    async function loadDocuments() {
      let query = supabase.from('documents').select('*, document_types(name)');
      if (currentFolderId) {
        query = query.eq('folder_id', currentFolderId);
      } else {
        query = query.is('folder_id', null);
      }

      const { data, error } = await query;
      const container = document.getElementById('documents-list');
      container.innerHTML = '';

      if (data && data.length > 0) {
        data.forEach(doc => {
          const typeName = doc.document_types ? doc.document_types.name : 'Sem tipo';
          container.innerHTML += `
            <a href="${doc.file_url}" target="_blank" class="bg-white p-3 rounded-xl border flex items-center justify-between shadow-sm hover:border-blue-400">
              <div class="flex items-center gap-3">
                <i class="fa-solid fa-file-lines text-blue-500 text-xl"></i>
                <div>
                  <p class="font-medium text-sm">${doc.title}</p>
                  <span class="text-xs bg-gray-100 text-gray-600 px-2 py-0.5 rounded-full">${typeName}</span>
                </div>
              </div>
              <i class="fa-solid fa-arrow-up-right-from-square text-gray-400 text-xs"></i>
            </a>
          `;
        });
      } else {
        container.innerHTML = `<p class="text-sm text-gray-400">Nenhum documento nesta pasta.</p>`;
      }
    }

    // Navegar entre diretórios
    function navigateToFolder(id, name) {
      folderHistory.push({ id, name });
      currentFolderId = id;
      refreshView();
    }

    function navigateToBreadcrumb(index) {
      if (index === -1) {
        currentFolderId = null;
        folderHistory = [];
      } else {
        folderHistory = folderHistory.slice(0, index + 1);
        currentFolderId = folderHistory[folderHistory.length - 1].id;
      }
      refreshView();
    }

    function refreshView() {
      loadFolders();
      loadDocuments();
      loadBreadcrumb();
    }

    function loadBreadcrumb() {
      const container = document.getElementById('breadcrumb');
      let html = `<button onclick="navigateToBreadcrumb(-1)" class="font-semibold ${folderHistory.length === 0 ? 'text-blue-600' : 'text-gray-500'}">Início</button>`;
      
      folderHistory.forEach((item, index) => {
        html += ` <span class="text-gray-400">/</span> `;
        html += `<button onclick="navigateToBreadcrumb(${index})" class="${index === folderHistory.length - 1 ? 'font-semibold text-blue-600' : 'text-gray-500'}">${item.name}</button>`;
      });

      container.innerHTML = html;
    }

    // Criar Nova Pasta
    async function createFolder() {
      const input = document.getElementById('folder-name-input');
      const name = input.value.trim();
      if (!name) return;

      await supabase.from('folders').insert([{ name, parent_id: currentFolderId }]);
      input.value = '';
      closeModals();
      loadFolders();
    }

    // Upload de Arquivo/Foto
    async function uploadDocument() {
      const title = document.getElementById('doc-title-input').value.trim();
      const typeId = document.getElementById('doc-type-select').value;
      const fileInput = document.getElementById('doc-file-input');
      const file = fileInput.files[0];

      if (!title || !file) {
        alert('Preencha o título e selecione um arquivo.');
        return;
      }

      const btn = document.getElementById('btn-upload');
      btn.innerText = 'Enviando...';
      btn.disabled = true;

      // 1. Upload do Arquivo para o Storage
      const fileName = `${Date.now()}_${file.name}`;
      const { data: storageData, error: storageError } = await supabase.storage.from('documentos').upload(fileName, file);

      if (storageError) {
        alert('Erro no upload do arquivo.');
        btn.innerText = 'Salvar';
        btn.disabled = false;
        return;
      }

      // 2. Obter URL Pública
      const { data: urlData } = supabase.storage.from('documentos').getPublicUrl(fileName);

      // 3. Salvar Registro no Banco
      await supabase.from('documents').insert([{
        title,
        file_url: urlData.publicUrl,
        folder_id: currentFolderId,
        type_id: typeId || null
      }]);

      btn.innerText = 'Salvar';
      btn.disabled = false;
      closeModals();
      loadDocuments();
    }

    // Gerenciador de Tipos de Documentos
    async function loadDocumentTypes() {
      const { data } = await supabase.from('document_types').select('*').order('name');
      const select = document.getElementById('doc-type-select');
      const list = document.getElementById('types-list');
      
      select.innerHTML = '<option value="">Selecione um tipo...</option>';
      list.innerHTML = '';

      if (data) {
        data.forEach(t => {
          select.innerHTML += `<option value="${t.id}">${t.name}</option>`;
          list.innerHTML += `<div class="p-1 bg-gray-50 rounded border mb-1">${t.name}</div>`;
        });
      }
    }

    async function createDocumentType() {
      const input = document.getElementById('type-name-input');
      const name = input.value.trim();
      if (!name) return;

      await supabase.from('document_types').insert([{ name }]);
      input.value = '';
      loadDocumentTypes();
    }

    // Controle de Modais
    function openFolderModal() { document.getElementById('folder-modal').classList.remove('hidden'); }
    function openUploadModal() { document.getElementById('upload-modal').classList.remove('hidden'); }
    function openTypeModal() { document.getElementById('type-modal').classList.remove('hidden'); }
    function closeModals() {
      document.getElementById('folder-modal').classList.add('hidden');
      document.getElementById('upload-modal').classList.add('hidden');
      document.getElementById('type-modal').classList.add('hidden');
    }
  </script>
</body>
</html>
